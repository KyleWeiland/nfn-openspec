name: Daily Article Update and Deployment

on:
  # Daily at 6 AM UTC
  schedule:
    - cron: '0 6 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: 'Skip fetching new articles (rebuild only)'
        required: false
        type: boolean
        default: false

# Set permissions for GitHub Pages deployment, repo commits, and failure issues
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo with full history for push back
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Set up Python 3.11+ with pip caching
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      # 3. Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # 4. Fetch articles from RSS feeds
      - name: Fetch articles
        if: ${{ !inputs.skip_fetch }}
        run: python scripts/fetch_articles.py

      # 5. Export data to JSON for Astro
      - name: Export data for Astro
        run: python scripts/export_for_astro.py

      # 6. Set up Node.js 20+ with npm caching
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      # 7. Install Astro dependencies
      - name: Install Node dependencies
        run: |
          cd site
          npm ci

      # 8. Build Astro site
      - name: Build Astro site
        run: |
          cd site
          npm run build

      # 9. Commit updated database and JSON files back to repo
      - name: Commit updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Add updated files
          git add data/articles.db data/articles.json data/categories.json

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            # Determine commit message based on trigger type and skip_fetch input
            if [ "${{ github.event_name }}" = "schedule" ]; then
              COMMIT_MSG="chore: daily article update [skip ci]"
            elif [ "${{ inputs.skip_fetch }}" = "true" ]; then
              COMMIT_MSG="chore: manual rebuild [skip ci]"
            else
              COMMIT_MSG="chore: manual article update [skip ci]"
            fi

            git commit -m "$COMMIT_MSG"
            git push
          fi

      # 10. Configure GitHub Pages
      - name: Configure Pages
        uses: actions/configure-pages@v4

      # 11. Upload artifact for Pages deployment
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/dist'

      # 12. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Report failures as a GitHub issue that mentions the maintainers, and close it
  # on the next success. Runs even when fetch-and-build fails; skipped when cancelled.
  report-status:
    needs: fetch-and-build
    if: ${{ always() && needs.fetch-and-build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      MAINTAINERS: '@KyleWeiland @Darthmaul'
      LABEL: pipeline-failure
      RESULT: ${{ needs.fetch-and-build.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVENT: ${{ github.event_name }}
      SHA: ${{ github.sha }}

    steps:
      - name: Open, update, or close the pipeline-failure issue
        run: |
          gh label create "$LABEL" --color B60205 \
            --description "Daily pipeline run failed" --force
          ISSUE=$(gh issue list --label "$LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          DETAILS="- Run: $RUN_URL
          - Trigger: \`$EVENT\`
          - Commit: \`${SHA:0:7}\`"

          if [ "$RESULT" = "success" ]; then
            if [ -n "$ISSUE" ]; then
              gh issue close "$ISSUE" --comment "Recovered: the pipeline succeeded.

          $DETAILS"
            fi
          elif [ "$RESULT" = "failure" ]; then
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body "Failed again.

          $DETAILS"
            else
              gh issue create --title "Daily pipeline failing" --label "$LABEL" --body "The daily article pipeline failed, so the site is not being updated.

          $DETAILS

          $MAINTAINERS: check the run log. This issue closes automatically on the next successful run."
            fi
          fi
